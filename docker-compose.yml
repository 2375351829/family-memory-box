services:
  family-memory-box:
    build: .
    container_name: family-memory-box
    ports: ["8080:5000"]
    volumes: ["./data:/data"]        # NAS 上改为本地绝对路径，如 /vol1/1000/family-memory-box/data（勿用 SMB/CIFS 挂载点，见第十四节）
    environment:
      - DATA_DIR=/data
      - TZ=Asia/Shanghai
    user: "1000:1000"                # 与 Dockerfile 内 USER 一致，避免 root 写坏 NAS 属主
    restart: unless-stopped
    logging:                         # json-file 默认不轮转，NAS 长期运行会撑满 /var/lib/docker
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s               # 冷启动 + WAL 初始化留余量，避免误判 unhealthy
