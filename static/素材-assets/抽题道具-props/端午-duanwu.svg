  <path d="M110 66 L176 178 C178 192 152 208 110 208 C68 208 42 192 44 178 Z" fill="none" stroke="#E2B75E" stroke-opacity=".55" stroke-width="2.2"/>
  <path d="M84 206 C78 162 88 112 108 74" fill="none" stroke="#FFFDF8" stroke-opacity=".32" stroke-width="4" stroke-linecap="round"/>
  <path d="M110 66 C102 128 98 172 98 206" fill="none" stroke="#5F3A12" stroke-opacity=".26" stroke-width="3" stroke-linecap="round"/>
