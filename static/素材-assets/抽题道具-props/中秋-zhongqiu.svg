    <circle r="30" fill="none" stroke="#FFF0C4" stroke-opacity=".7" stroke-width="2"/>
    <circle r="21" fill="none" stroke="#96201A" stroke-opacity=".45" stroke-width="1.8"/>
    <g fill="none" stroke="#FFF0C4" stroke-opacity="0.5" stroke-width="2" stroke-linecap="square"><path d="M-20 8V-6h12v7h-7v-4"/><path d="M0 8V-6h12v7h-7v-4"/></g>
    <circle r="6" fill="#C0392B" opacity=".8"/>
  </g>
  <g transform="translate(160 196)"><ellipse cx="12.1" cy="0.0" rx="9.2" ry="5.3" transform="rotate(0 12.1 0.0)" fill="#FFF0C4" opacity=".92"/><ellipse cx="3.7" cy="11.5" rx="9.2" ry="5.3" transform="rotate(72 3.7 11.5)" fill="#FFF0C4" opacity=".92"/><ellipse cx="-9.8" cy="7.1" rx="9.2" ry="5.3" transform="rotate(144 -9.8 7.1)" fill="#FFF0C4" opacity=".92"/><ellipse cx="-9.8" cy="-7.1" rx="9.2" ry="5.3" transform="rotate(216 -9.8 -7.1)" fill="#FFF0C4" opacity=".92"/><ellipse cx="3.7" cy="-11.5" rx="9.2" ry="5.3" transform="rotate(288 3.7 -11.5)" fill="#FFF0C4" opacity=".92"/><circle r="6.6" fill="#E2B75E"/></g>
  <path d="M150 200 C160 176 168 160 176 148" fill="none" stroke="#3E8E5A" stroke-opacity=".7" stroke-width="2.4" stroke-linecap="round"/>
  <g transform="translate(176 148)"><ellipse cx="6.1" cy="0.0" rx="4.6" ry="2.6" transform="rotate(0 6.1 0.0)" fill="#5FA96F" opacity=".92"/><ellipse cx="0.0" cy="6.1" rx="4.6" ry="2.6" transform="rotate(90 0.0 6.1)" fill="#5FA96F" opacity=".92"/><ellipse cx="-6.1" cy="0.0" rx="4.6" ry="2.6" transform="rotate(180 -6.1 0.0)" fill="#5FA96F" opacity=".92"/><ellipse cx="-0.0" cy="-6.1" rx="4.6" ry="2.6" transform="rotate(270 -0.0 -6.1)" fill="#5FA96F" opacity=".92"/><circle r="3.3" fill="#FFF0C4"/></g>
  <ellipse cx="110" cy="212" rx="58" ry="9" fill="#04070F" opacity=".42"/>
  <ellipse cx="110" cy="211" rx="44" ry="6" fill="#FFD97D" opacity=".18"/>
