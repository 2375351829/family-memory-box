    <use href="#spark" transform="translate(124 168) scale(.5)"/>
    <use href="#spark" transform="translate(106 178) scale(.42)"/>
    <use href="#spark" transform="translate(130 138) scale(.38)"/>
  </g>
  <path d="M110 96 C104 116 116 126 110 146" fill="none" stroke="#FFF0C4" stroke-opacity=".4" stroke-width="1.8" stroke-dasharray="4 5"/>
  <ellipse cx="110" cy="212" rx="58" ry="9" fill="#04070F" opacity=".42"/>
  <ellipse cx="110" cy="211" rx="44" ry="6" fill="#FFD97D" opacity=".18"/>
