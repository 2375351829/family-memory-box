<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" width="1440" height="760" role="img" aria-label="中秋月夜长卷">
  <!-- 月夜长卷（手绘 SVG · v3）：满月 + 祥云 + 飞鸟 + 双灯笼 + 三层水墨远山
       用途：① 首页 hero 画卷底（cover 居中裁切）② 全站底部远山装饰带（bottom cover 裁切）
       约束：透明背景、无外部资源、无文字。 -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFE9AE" stop-opacity=".55"/>
      <stop offset=".42" stop-color="#FFD97D" stop-opacity=".20"/>
      <stop offset="1" stop-color="#FFD97D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonG" cx="38%" cy="34%" r="72%">
      <stop offset="0" stop-color="#FFFCEF"/>
      <stop offset=".45" stop-color="#F8ECBE"/>
      <stop offset="1" stop-color="#DDB96A"/>
    </radialGradient>
    <linearGradient id="cloudFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9AE" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFD97D" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A4772" stop-opacity=".92"/>
      <stop offset="1" stop-color="#16294A" stop-opacity=".86"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16294A" stop-opacity=".96"/>
      <stop offset="1" stop-color="#0D1B33" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1526"/>
      <stop offset="1" stop-color="#060C18"/>
    </linearGradient>
    <linearGradient id="lanta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E85B40"/>
      <stop offset=".55" stop-color="#C0392B"/>
      <stop offset="1" stop-color="#8E1F16"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF0C4"/>
      <stop offset=".5" stop-color="#E2B75E"/>
      <stop offset="1" stop-color="#A97C2C"/>
    </linearGradient>
    <!-- 如意云（复用件） -->
    <path id="cloudA" d="M34 108c-14 0-25-10-25-22s11-22 25-22c5-16 20-27 38-27 21 0 38 14 42 33 4-2 9-4 15-4 17 0 29 11 29 26s-12 26-29 26z"/>
    <path id="cloudB" d="M0 0c8-7 20-6 26 1 6 7 4 17-4 21-7 4-15 0-16-7-1-5 3-9 8-9 4 0 7 3 7 7"/>
    <path id="bird" d="M0 0q7-8 14 0q7-8 14 0" fill="none" stroke="#E2B75E" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
    <!-- 灯笼（复用件） -->
    <g id="lantern">
      <path d="M0 0v66" stroke="url(#gold)" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="-13" y="64" width="26" height="12" rx="4" fill="url(#gold)"/>
      <path d="M0 76c-46 0-74 30-74 66s28 66 74 66 74-30 74-66-28-66-74-66z" fill="url(#lanta)"/>
      <g fill="none" stroke="url(#gold)" stroke-opacity=".55" stroke-width="2">
        <path d="M0 78v128"/>
        <path d="M-40 90c-16 12-24 30-24 52s10 42 26 54"/>
        <path d="M40 90c16 12 24 30 24 52s-10 42-26 54"/>
        <path d="M-62 122c-6 8-9 14-9 20s3 12 9 20"/>
        <path d="M62 122c6 8 9 14 9 20s-3 12-9 20"/>
      </g>
      <rect x="-16" y="72" width="32" height="10" rx="3" fill="url(#gold)"/>
      <rect x="-20" y="200" width="40" height="12" rx="4" fill="url(#gold)"/>
      <circle cx="0" cy="218" r="6" fill="url(#gold)"/>
      <path d="M-16 224h32l-5 46h-22z" fill="url(#lanta)"/>
      <g stroke="#C0392B" stroke-width="2" stroke-linecap="round" opacity=".9">
        <path d="M-10 270v18M-3 270v22M4 270v20M10 270v16"/>
      </g>
    </g>
  </defs>

  <!-- 月晕与满月 -->
  <circle cx="1052" cy="196" r="300" fill="url(#halo)"/>
  <circle cx="1052" cy="196" r="92" fill="url(#moonG)"/>
  <g fill="#C79A4E" opacity=".22">
    <circle cx="1018" cy="176" r="15"/>
    <circle cx="1064" cy="150" r="9"/>
    <circle cx="1084" cy="220" r="12"/>
    <circle cx="1032" cy="228" r="7"/>
    <circle cx="1076" cy="188" r="5"/>
  </g>

  <!-- 祥云（云头 + 卷云尾） -->
  <g>
    <use href="#cloudA" transform="translate(700 208) scale(1.28)" fill="url(#cloudFill)" stroke="#E2B75E" stroke-opacity=".38" stroke-width="2"/>
    <use href="#cloudA" transform="translate(1180 300) scale(.86)" fill="url(#cloudFill)" stroke="#E2B75E" stroke-opacity=".3" stroke-width="2"/>
    <use href="#cloudB" transform="translate(906 120) scale(1.2)" fill="none" stroke="#E2B75E" stroke-opacity=".34" stroke-width="2" stroke-linecap="round"/>
    <use href="#cloudB" transform="translate(430 300) scale(1.5)" fill="none" stroke="#E2B75E" stroke-opacity=".26" stroke-width="2" stroke-linecap="round"/>
    <use href="#cloudA" transform="translate(150 380) scale(1.05)" fill="url(#cloudFill)" stroke="#E2B75E" stroke-opacity=".26" stroke-width="2"/>
  </g>

  <!-- 飞鸟 -->
  <g>
    <use href="#bird" transform="translate(560 150) scale(1)"/>
    <use href="#bird" transform="translate(620 118) scale(.8)"/>
    <use href="#bird" transform="translate(498 112) scale(.7)"/>
  </g>

  <!-- 星点 -->
  <g fill="#FFE9AE" opacity=".6">
    <circle cx="180" cy="120" r="2.6"/><circle cx="320" cy="80" r="1.8"/>
    <circle cx="780" cy="70" r="2.2"/><circle cx="1330" cy="120" r="2.4"/>
    <circle cx="1240" cy="520" r="2"/><circle cx="120" cy="260" r="2"/>
  </g>

  <!-- 三层水墨远山（脊线描金） -->
  <path d="M0 470 Q90 358 192 420 Q282 472 362 400 Q432 338 522 410 Q602 470 692 400 Q782 328 882 410 Q962 470 1062 400 Q1152 338 1252 420 Q1342 470 1440 428 L1440 760 L0 760 Z" fill="url(#far)"/>
  <path d="M0 470 Q90 358 192 420 Q282 472 362 400 Q432 338 522 410 Q602 470 692 400 Q782 328 882 410 Q962 470 1062 400 Q1152 338 1252 420 Q1342 470 1440 428" fill="none" stroke="#E2B75E" stroke-opacity=".26" stroke-width="2.4"/>
  <path d="M0 566 Q140 480 282 542 Q422 602 562 530 Q702 458 862 542 Q1002 612 1142 540 Q1282 468 1440 542 L1440 760 L0 760 Z" fill="url(#mid)"/>
  <path d="M0 566 Q140 480 282 542 Q422 602 562 530 Q702 458 862 542 Q1002 612 1142 540 Q1282 468 1440 542" fill="none" stroke="#E2B75E" stroke-opacity=".18" stroke-width="2"/>
  <path d="M0 684 Q182 622 362 672 Q542 722 722 660 Q902 598 1082 672 Q1262 744 1440 682 L1440 760 L0 760 Z" fill="url(#near)"/>

  <!-- 悬灯两盏 -->
  <use href="#lantern" transform="translate(176 26) scale(1)"/>
  <use href="#lantern" transform="translate(1284 6) scale(.84)"/>
</svg>