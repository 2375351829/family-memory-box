  <path d="M110 152 C94 140 78 136 62 138M110 130 C126 118 144 116 160 120" fill="none" stroke="#FFF0C4" stroke-opacity=".4" stroke-width="1.6"/>
  <g transform="translate(158 176) rotate(20)">
