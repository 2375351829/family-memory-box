<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="220" height="260" role="img" aria-label="腊八抽题粥碗">
  <!-- 腊八抽题粥碗（手绘 SVG · 站内「朱红·描金·夜色」体系：月晕 → 星芒 → 主体 → 地面投影+金辉） -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF0C4"/><stop offset=".45" stop-color="#E2B75E"/><stop offset="1" stop-color="#A97C2C"/>
    </linearGradient>
    <linearGradient id="goldX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A97C2C"/><stop offset=".4" stop-color="#FFF0C4"/><stop offset="1" stop-color="#E2B75E"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E85B40"/><stop offset=".5" stop-color="#C0392B"/><stop offset="1" stop-color="#96201A"/>
    </linearGradient>
    <linearGradient id="redX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#96201A"/><stop offset=".38" stop-color="#E85B40"/><stop offset="1" stop-color="#7C140F"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B7281C"/><stop offset="1" stop-color="#7C140F"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/><stop offset="1" stop-color="#F3E7CE"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5F3A12"/><stop offset=".3" stop-color="#B87F31"/><stop offset=".62" stop-color="#E2B75E"/><stop offset="1" stop-color="#96621F"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F5C8A"/><stop offset="1" stop-color="#1B3A5C"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FA96F"/><stop offset="1" stop-color="#3E8E5A"/>
    </linearGradient>
    <linearGradient id="pump" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8933A"/><stop offset=".45" stop-color="#D9822B"/><stop offset="1" stop-color="#A8531A"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="46%" r="52%">
      <stop offset="0" stop-color="#FFD97D" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#FFD97D" stop-opacity=".13"/>
      <stop offset="1" stop-color="#FFD97D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="50%" cy="52%" r="50%">
      <stop offset="0" stop-color="#FFE9A8" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#FFD97D" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FFD97D" stop-opacity="0"/>
    </radialGradient>
    <path id="spark" d="M0 -6 L1.7 -1.7 L6 0 L1.7 1.7 L0 6 L-1.7 1.7 L-6 0 L-1.7 -1.7 Z" fill="#FFD97D"/>
  </defs>
  <circle cx="110" cy="132" r="104" fill="url(#halo)"/>
  <g opacity="1">
    <use href="#spark" transform="translate(38 86) scale(.8)" opacity=".62"/>
    <use href="#spark" transform="translate(184 74) scale(.58)" opacity=".5"/>
    <use href="#spark" transform="translate(30 168) scale(.5)" opacity=".42"/>
    <use href="#spark" transform="translate(190 172) scale(.72)" opacity=".55"/>
    <use href="#spark" transform="translate(62 232) scale(.46)" opacity=".36"/>
    <use href="#spark" transform="translate(162 230) scale(.5)" opacity=".42"/>
  </g>
  
  <path d="M70 148 C70 190 88 208 110 208 C132 208 150 190 150 148 Z" fill="url(#night)"/>
  <path d="M70 148 C70 190 88 208 110 208 C132 208 150 190 150 148 Z" fill="none" stroke="#E2B75E" stroke-opacity=".6" stroke-width="2"/>
  <path d="M86 156 C82 180 86 196 96 204" fill="none" stroke="#FFF0C4" stroke-opacity=".26" stroke-width="6" stroke-linecap="round"/>
  <g fill="none" stroke="#FFF0C4" stroke-opacity="0.48" stroke-width="2" stroke-linecap="square"><path d="M88 200V186h12v7h-7v-4"/><path d="M108 200V186h12v7h-7v-4"/></g>
  <ellipse cx="110" cy="148" rx="46" ry="13" fill="#F3E7CE"/>
  <ellipse cx="110" cy="148" rx="46" ry="13" fill="none" stroke="url(#goldX)" stroke-width="4"/>
  <g>
    <circle cx="92" cy="146" r="7" fill="#C0392B"/><circle cx="112" cy="142" r="6" fill="#A97C2C"/>
    <circle cx="128" cy="150" r="6.6" fill="#FFFDF8"/><circle cx="102" cy="152" r="5" fill="#B7281C"/>
    <circle cx="120" cy="140" r="4.4" fill="#3E8E5A"/>
  </g>
  <g fill="none" stroke="#FFF0C4" stroke-opacity=".38" stroke-width="2.4" stroke-linecap="round">
    <path d="M96 132 C92 118 100 108 96 92"/><path d="M114 128 C110 112 118 102 114 84"/>
  </g>
  <path d="M142 116 L170 104" stroke="#B87F31" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="170" cy="104" rx="10" ry="7" fill="url(#wood)"/>
  <ellipse cx="110" cy="212" rx="58" ry="9" fill="#04070F" opacity=".42"/>
  <ellipse cx="110" cy="211" rx="44" ry="6" fill="#FFD97D" opacity=".18"/>
</svg>