<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 320" width="260" height="320" role="img" aria-label="竹制签筒">
  <!-- 抽签筒插画（手绘 SVG · v3）
       组成：月晕 → 六支竹签（朱红/描金签头）→ 竹筒（渐变+竹节+回纹带+高光/暗部）
             → 筒口（暗腔+描金圈口）→ 红绸带与流苏 → 地面投影与金辉 → 星芒点缀
       约束：透明背景；不含外部字体/图片；仅供 .view-draw-tumbler 作 background-image 使用。 -->
  <defs>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C4E1C"/>
      <stop offset=".14" stop-color="#B87F31"/>
      <stop offset=".38" stop-color="#EFCE8A"/>
      <stop offset=".58" stop-color="#D3A24F"/>
      <stop offset=".82" stop-color="#96621F"/>
      <stop offset="1" stop-color="#5F3A12"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF0C4"/>
      <stop offset=".45" stop-color="#E2B75E"/>
      <stop offset="1" stop-color="#8F6220"/>
    </linearGradient>
    <linearGradient id="stickA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C6A164"/>
      <stop offset=".45" stop-color="#F6E7C2"/>
      <stop offset="1" stop-color="#B08A4E"/>
    </linearGradient>
    <linearGradient id="rib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E85B40"/>
      <stop offset="1" stop-color="#96201A"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="46%" r="52%">
      <stop offset="0" stop-color="#FFD97D" stop-opacity=".46"/>
      <stop offset=".55" stop-color="#FFD97D" stop-opacity=".14"/>
      <stop offset="1" stop-color="#FFD97D" stop-opacity="0"/>
    </radialGradient>
    <!-- 星芒 -->
    <path id="spark" d="M0 -6 L1.7 -1.7 L6 0 L1.7 1.7 L0 6 L-1.7 1.7 L-6 0 L-1.7 -1.7 Z" fill="#FFD97D"/>
  </defs>

  <!-- 月晕 -->
  <circle cx="130" cy="150" r="124" fill="url(#halo)"/>

  <!-- 星芒点缀 -->
  <g>
    <use href="#spark" x="0" y="0" transform="translate(56 84) scale(.85)" opacity=".7"/>
    <use href="#spark" x="0" y="0" transform="translate(208 98) scale(.6)" opacity=".55"/>
    <use href="#spark" x="0" y="0" transform="translate(38 168) scale(.5)" opacity=".45"/>
    <use href="#spark" x="0" y="0" transform="translate(224 176) scale(.75)" opacity=".6"/>
    <use href="#spark" x="0" y="0" transform="translate(72 238) scale(.45)" opacity=".4"/>
    <use href="#spark" x="0" y="0" transform="translate(196 232) scale(.5)" opacity=".5"/>
  </g>

  <!-- 签条（六支，签头朱红/描金） -->
  <g>
    <g transform="rotate(-11 104 138)">
      <rect x="98" y="54" width="12" height="84" rx="6" fill="url(#stickA)" stroke="#8A6A34" stroke-width="1"/>
      <rect x="98" y="54" width="12" height="13" rx="6" fill="#C0392B"/>
      <rect x="98" y="69" width="12" height="3" fill="#E2B75E" opacity=".9"/>
    </g>
    <g transform="rotate(-5 116 138)">
      <rect x="110" y="42" width="12" height="96" rx="6" fill="url(#stickA)" stroke="#8A6A34" stroke-width="1"/>
      <rect x="110" y="42" width="12" height="13" rx="6" fill="#E2B75E"/>
      <rect x="110" y="57" width="12" height="3" fill="#96201A" opacity=".85"/>
    </g>
    <g>
      <rect x="124" y="34" width="12" height="104" rx="6" fill="url(#stickA)" stroke="#8A6A34" stroke-width="1"/>
      <rect x="124" y="34" width="12" height="13" rx="6" fill="#C0392B"/>
      <rect x="124" y="49" width="12" height="3" fill="#E2B75E" opacity=".9"/>
    </g>
    <g transform="rotate(5 144 138)">
      <rect x="138" y="46" width="12" height="92" rx="6" fill="url(#stickA)" stroke="#8A6A34" stroke-width="1"/>
      <rect x="138" y="46" width="12" height="13" rx="6" fill="#E2B75E"/>
      <rect x="138" y="61" width="12" height="3" fill="#96201A" opacity=".85"/>
    </g>
    <g transform="rotate(11 156 138)">
      <rect x="150" y="58" width="12" height="80" rx="6" fill="url(#stickA)" stroke="#8A6A34" stroke-width="1"/>
      <rect x="150" y="58" width="12" height="13" rx="6" fill="#C0392B"/>
      <rect x="150" y="73" width="12" height="3" fill="#E2B75E" opacity=".9"/>
    </g>
  </g>

  <!-- 筒身 -->
  <path d="M64 124 L92 268 C95 281 106 289 124 289 L136 289 C154 289 165 281 168 268 L196 124 Z" fill="url(#tube)"/>
  <!-- 暗部与高光 -->
  <path d="M176 140 C182 184 178 228 170 262" fill="none" stroke="#3E2409" stroke-opacity=".38" stroke-width="11" stroke-linecap="round"/>
  <path d="M92 142 C86 186 88 226 94 258" fill="none" stroke="#FFF6D8" stroke-opacity=".26" stroke-width="8" stroke-linecap="round"/>
  <path d="M97 146 C92 186 94 222 99 252" fill="none" stroke="#FFF9E4" stroke-opacity=".3" stroke-width="3" stroke-linecap="round"/>
  <!-- 竹节 -->
  <g fill="none" stroke-linecap="round">
    <path d="M76 178 Q130 187 184 178" stroke="#6E461A" stroke-opacity=".5" stroke-width="2.6"/>
    <path d="M76 181 Q130 190 184 181" stroke="#FFF0C4" stroke-opacity=".24" stroke-width="1.6"/>
    <path d="M86 234 Q130 243 174 234" stroke="#6E461A" stroke-opacity=".5" stroke-width="2.6"/>
    <path d="M86 237 Q130 246 174 237" stroke="#FFF0C4" stroke-opacity=".24" stroke-width="1.6"/>
  </g>
  <!-- 回纹带（描金） -->
  <g fill="none" stroke="#FFF0C4" stroke-opacity=".5" stroke-width="2" stroke-linecap="square">
    <path d="M80 214V200h12v7h-7v-4"/>
    <path d="M100 214V200h12v7h-7v-4"/>
    <path d="M120 214V200h12v7h-7v-4"/>
    <path d="M140 214V200h12v7h-7v-4"/>
    <path d="M160 214V200h12v7h-7v-4"/>
  </g>

  <!-- 筒口：暗腔 + 描金圈口 -->
  <ellipse cx="130" cy="124" rx="52" ry="13" fill="#2A1908"/>
  <ellipse cx="130" cy="126" rx="50" ry="11" fill="#160C03" opacity=".85"/>
  <ellipse cx="130" cy="124" rx="66" ry="17" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <path d="M64 124 A66 17 0 0 0 196 124" fill="none" stroke="#FFF3CE" stroke-opacity=".55" stroke-width="2.4"/>

  <!-- 红绸带（束筒） -->
  <path d="M69 152 Q130 168 191 152 L190 167 Q130 183 70 167 Z" fill="url(#rib)" opacity=".96"/>
  <path d="M69 152 Q130 168 191 152" fill="none" stroke="#FFB9A4" stroke-opacity=".5" stroke-width="1.6"/>
  <path d="M70 167 Q130 183 190 167" fill="none" stroke="#5E120C" stroke-opacity=".5" stroke-width="1.6"/>

  <!-- 结与流苏（右侧垂落） -->
  <g>
    <circle cx="189" cy="160" r="7" fill="url(#rib)" stroke="#FFD97D" stroke-opacity=".55" stroke-width="1.4"/>
    <path d="M189 160 C201 150 214 154 213 165 C212 174 200 176 192 168" fill="url(#rib)" opacity=".95"/>
    <path d="M189 160 C203 156 209 163 205 170" fill="none" stroke="#5E120C" stroke-opacity=".45" stroke-width="1.6"/>
    <path d="M189 166 C193 196 197 226 199 246" fill="none" stroke="#B7281C" stroke-width="3" stroke-linecap="round"/>
    <path d="M189 166 C186 196 184 226 183 246" fill="none" stroke="#96201A" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="176" y="245" width="30" height="5" rx="2.5" fill="#E2B75E"/>
    <path d="M178 250 h26 l-4 30 h-18 Z" fill="url(#rib)"/>
    <g stroke="#C0392B" stroke-width="2" stroke-linecap="round" opacity=".95">
      <path d="M180 280 v22"/>
      <path d="M186 280 v26"/>
      <path d="M192 280 v24"/>
      <path d="M198 280 v20"/>
    </g>
  </g>

  <!-- 地面投影与金辉 -->
  <ellipse cx="130" cy="293" rx="86" ry="13" fill="#04070F" opacity=".6"/>
  <ellipse cx="130" cy="292" rx="54" ry="7" fill="#FFD97D" opacity=".15"/>
</svg>