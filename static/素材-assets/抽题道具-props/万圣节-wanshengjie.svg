<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="220" height="260" role="img" aria-label="万圣节抽题南瓜灯">
  <!-- 万圣节抽题南瓜灯（手绘 SVG · 站内「朱红·描金·夜色」体系：月晕 → 星芒 → 主体 → 地面投影+金辉） -->
  <defs>
