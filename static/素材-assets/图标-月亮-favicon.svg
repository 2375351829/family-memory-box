      <stop offset="0" stop-color="#13233F"/>
      <stop offset="1" stop-color="#070D18"/>
    </linearGradient>
    <linearGradient id="fmoon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFCEF"/>
      <stop offset="1" stop-color="#E7C477"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#fnight)"/>
  <circle cx="32" cy="32" r="22" fill="#FFD97D" opacity=".12"/>
  <path d="M41 16a17 17 0 1 0 8 25 14 14 0 0 1-8-25z" fill="url(#fmoon)"/>
  <g fill="#F6D06A" opacity=".9">
