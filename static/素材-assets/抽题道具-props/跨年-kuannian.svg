  <rect x="92" y="40" width="36" height="20" rx="5" fill="none" stroke="#E2B75E" stroke-opacity=".5" stroke-width="1.6"/>
  <ellipse cx="110" cy="188" rx="38" ry="10" fill="#A97C2C" opacity=".35"/>
  <g opacity=".95">
