  <path d="M152 84 C164 64 176 52 190 44" fill="none" stroke="#3E8E5A" stroke-opacity=".8" stroke-width="2.6" stroke-linecap="round"/>
  <g transform="translate(192 42)"><ellipse cx="8.3" cy="0.0" rx="6.3" ry="3.6" transform="rotate(0 8.3 0.0)" fill="#5FA96F" opacity=".92"/><ellipse cx="4.1" cy="7.1" rx="6.3" ry="3.6" transform="rotate(60 4.1 7.1)" fill="#5FA96F" opacity=".92"/><ellipse cx="-4.1" cy="7.1" rx="6.3" ry="3.6" transform="rotate(120 -4.1 7.1)" fill="#5FA96F" opacity=".92"/><ellipse cx="-8.3" cy="0.0" rx="6.3" ry="3.6" transform="rotate(180 -8.3 0.0)" fill="#5FA96F" opacity=".92"/><ellipse cx="-4.1" cy="-7.1" rx="6.3" ry="3.6" transform="rotate(240 -4.1 -7.1)" fill="#5FA96F" opacity=".92"/><ellipse cx="4.1" cy="-7.1" rx="6.3" ry="3.6" transform="rotate(300 4.1 -7.1)" fill="#5FA96F" opacity=".92"/><circle r="4.5" fill="#FFF0C4"/></g>
  <g transform="translate(170 66)"><ellipse cx="6.1" cy="0.0" rx="4.6" ry="2.6" transform="rotate(0 6.1 0.0)" fill="#5FA96F" opacity=".92"/><ellipse cx="1.9" cy="5.8" rx="4.6" ry="2.6" transform="rotate(72 1.9 5.8)" fill="#5FA96F" opacity=".92"/><ellipse cx="-4.9" cy="3.6" rx="4.6" ry="2.6" transform="rotate(144 -4.9 3.6)" fill="#5FA96F" opacity=".92"/><ellipse cx="-4.9" cy="-3.6" rx="4.6" ry="2.6" transform="rotate(216 -4.9 -3.6)" fill="#5FA96F" opacity=".92"/><ellipse cx="1.9" cy="-5.8" rx="4.6" ry="2.6" transform="rotate(288 1.9 -5.8)" fill="#5FA96F" opacity=".92"/><circle r="3.3" fill="#FFF0C4"/></g>
  <ellipse cx="110" cy="212" rx="63" ry="9" fill="#04070F" opacity=".42"/>
  <ellipse cx="110" cy="211" rx="48" ry="6" fill="#FFD97D" opacity=".18"/>
