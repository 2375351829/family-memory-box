    <path d="M-11 0L11 0"/><path d="M-5.500000000000001 -9.526279441628825L5.500000000000001 9.526279441628825"/><path d="M5.499999999999997 -9.526279441628827L-5.499999999999997 9.526279441628827"/>
  </g>
  <path d="M170 92 C160 108 152 128 150 148" fill="none" stroke="#3E8E5A" stroke-opacity=".8" stroke-width="2.6" stroke-linecap="round"/>
  <ellipse cx="110" cy="212" rx="56" ry="9" fill="#04070F" opacity=".42"/>
  <ellipse cx="110" cy="211" rx="42" ry="6" fill="#FFD97D" opacity=".18"/>
