  <path d="M110 200 V120" stroke="#96621F" stroke-width="7" stroke-linecap="round"/>
  <path d="M110 200 V120" stroke="#E2B75E" stroke-opacity=".45" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M110 152 C94 140 78 136 62 138 C70 156 90 166 110 160 Z" fill="url(#leaf)" opacity=".92"/>
