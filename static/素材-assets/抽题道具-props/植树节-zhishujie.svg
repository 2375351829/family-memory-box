    <path d="M34 -14 C48 -12 52 0 48 12 C38 16 30 10 30 0 Z" fill="url(#gold)"/>
  </g>
  <g fill="none" stroke="#FFF0C4" stroke-opacity="0.38" stroke-width="2" stroke-linecap="square"><path d="M70 196V182h12v7h-7v-4"/><path d="M90 196V182h12v7h-7v-4"/><path d="M110 196V182h12v7h-7v-4"/></g>
  <ellipse cx="110" cy="212" rx="59" ry="9" fill="#04070F" opacity=".42"/>
  <ellipse cx="110" cy="211" rx="45" ry="6" fill="#FFD97D" opacity=".18"/>
