  <rect x="62" y="126" width="96" height="72" rx="9" fill="none" stroke="#E2B75E" stroke-opacity=".55" stroke-width="2"/>
  <path d="M70 134 C74 172 76 190 76 196" fill="none" stroke="#FFF0C4" stroke-opacity=".22" stroke-width="6" stroke-linecap="round"/>
  <g fill="none" stroke="#FFF0C4" stroke-opacity="0.4" stroke-width="2" stroke-linecap="square"><path d="M74 192V178h12v7h-7v-4"/><path d="M94 192V178h12v7h-7v-4"/><path d="M114 192V178h12v7h-7v-4"/><path d="M134 192V178h12v7h-7v-4"/></g>
  <ellipse cx="110" cy="126" rx="48" ry="12" fill="#7C140F" opacity=".9"/>
  <ellipse cx="110" cy="124" rx="48" ry="12" fill="none" stroke="url(#goldX)" stroke-width="4"/>
  <g transform="translate(110 96)">
